<body>
    <header class="header">
        <nav class="nav-header">
            <a class="logo" href="../index.html">
                <img src="../img/logo_conectafacil.png" alt="Logo ConectaFácil" class="logo-img">

    <main id="main-usuario">
        <h2 id="nome-usuario">Olá Marcelo !</h2>
        <p>Seja muito benvindo(a) a sua jornada de aprendizado!!</p>

        <section class="secao-usuario" id="info-usuario">

                    <dd id="email-usuario">emailexemplo@gmail.com</dd>
                </div>
                <hr>
                <div>
                    <h4>Seu progresso</h4>
                    <progress id="meuProgresso" max="100"></progress>
                </div>

                <button id="logout">Sair</button>
            </div>
        </section>

        <section class="progresso-detalhado">
            <h4>Modulo(s) em andamento:</h4>
            <ul id="modulos-nao-concluidos"></ul>

    <script>
        const logoutBtn = document.getElementById('logout');

        logoutBtn.addEventListener('click', () => {
            firebase.auth().signOut().then(() => {
                alert('Você saiu com sucesso!');
                window.location.reload();
            }).catch((error) => {
                console.error('Erro ao sair:', error);
                alert('Erro ao sair. Tente novamente.');
            });
        });
    </script>
