<body style="display: flex; flex-direction: column; align-items: center; overflow-x: hidden;">
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W56X96QG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <main class="main-login">
    <div id="video-login">
      <h1>Como logar na minha conta</h1>
      <iframe src="https://www.youtube.com/embed/uKz7xXyiW0o?si=fygTFi2J58ZgmQCk" title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="form-container">
      <img src="../img/logo_conectafacil.png" alt="Logo Vai-Idade" class="logo-login">
      <h2>Login</h2>
      <form id="formLogin">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>
      <p>Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </main>

  <!-- Firebase SDK compatível -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="../src/js/DAL.js"></script>
  <script src="../src/js/Script.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      console.log(email);
      try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location.href = "../index.html";
        // console.log(user.uid)
      } catch (error) {
        alert("Erro: " + error.message);
      }
    });
  </script>
